# ─────────────────────────────────────────────────────────────────────────────
# be-boilerplate — GitLab CI/CD
#
# This file is copied as-is when running `make init NAME=<service>`.
# sed replaces "be_boilerplate" → "<service_underscore>" and
#              "be-boilerplate" → "<service>" automatically.
#
# Pipeline runs on:
#   • Pushes to the default branch
#   • Merge requests
#   • Tags matching v<major>.<minor>.<patch>  (invalid tags = no pipeline)
#
# Stages:
#   validate  → fmt-check, fmt-fix (advisory), lint            [parallel]
#   test      → test, coverage (≥ 85% or fail)                 [parallel, postgres + redis]
#   build     → uberjar → target/app.jar                       [tags only]
#   publish   → Docker image → GitLab Container Registry       [tags only]
#
# ── PREREQUISITE ─────────────────────────────────────────────────────────────
# deps.edn must use :git/url + :git/tag + :git/sha for all borba-*-component
# entries (no :local/root). The build and publish stages will fail otherwise.
# ─────────────────────────────────────────────────────────────────────────────

stages:
  - validate
  - test
  - build
  - publish

# ── Workflow: when to create a pipeline ──────────────────────────────────────
workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/   # valid semver tag → full pipeline
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Defaults for Clojure jobs ─────────────────────────────────────────────────
default:
  image: clojure:temurin-21-tools-deps
  cache:
    key:
      files:
        - deps.edn
    paths:
      - .m2/
      - .cpcache/
  before_script:
    # Redirect Maven + tools.deps cache into the project dir so GitLab can cache it
    - export JAVA_TOOL_OPTIONS="-Duser.home=$CI_PROJECT_DIR"
    - mkdir -p .m2 .cpcache

# ── Stage: validate ───────────────────────────────────────────────────────────

fmt-check:
  stage: validate
  script:
    - make fmt-check

fmt-fix:
  # Advisory only — shows what cljfmt would fix, does NOT block the pipeline.
  # Run `make fmt-fix` locally before pushing.
  stage: validate
  allow_failure: true
  script:
    - make fmt-fix
    - git diff --stat

lint:
  stage: validate
  script:
    - make lint

# ── Stage: test ───────────────────────────────────────────────────────────────
#
# Both jobs need PostgreSQL and Redis.
# Redis host is overridden via REDIS_HOST (base.edn: #or [#env REDIS_HOST "localhost"])
# Database URL is overridden via DATABASE_URL (test.edn: #or [#env DATABASE_URL "..."])

.test-services: &test-services
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    # PostgreSQL service
    POSTGRES_DB:       be_boilerplate_test
    POSTGRES_USER:     borba
    POSTGRES_PASSWORD: borba_secret
    # Override connection strings to point to CI service aliases
    DATABASE_URL: "jdbc:postgresql://postgres:5432/be_boilerplate_test"
    REDIS_HOST:   redis

test:
  stage: test
  <<: *test-services
  script:
    - make test

coverage:
  stage: test
  <<: *test-services
  script:
    - clojure -M:test -m kaocha.runner
        --plugin kaocha.plugin/cloverage
        --cov-output target/coverage
        --cov-fail-threshold 85
  # Regex captures the % from cloverage's stdout for GitLab's coverage badge
  coverage: '/(\d+\.?\d+)% covered/'
  artifacts:
    paths:
      - target/coverage/
    expire_in: 1 week

# ── Stage: build ─────────────────────────────────────────────────────────────

build:
  stage: build
  script:
    - APP_VERSION=$CI_COMMIT_TAG make build
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_COMMIT_TAG"
    paths:
      - target/app.jar
    expire_in: 4 weeks
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ── Stage: publish ────────────────────────────────────────────────────────────
#
# Builds a Docker image and pushes it to GitLab Container Registry.
# Image is tagged with the semver tag and "latest".
# Triggered only on valid vX.X.X tags.

publish:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
  script:
    - docker build
        --build-arg APP_VERSION=$CI_COMMIT_TAG
        --build-arg PORT=8080
        --build-arg PROFILE=prod
        -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
        -t "$CI_REGISTRY_IMAGE:latest"
        .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  needs:
    - build
